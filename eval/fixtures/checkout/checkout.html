<!doctype html><html lang="en"><meta charset="utf-8"><title>Checkout</title>
<h1>Checkout</h1><p>Order: <span id="order-id">order-1</span></p><p>Order total: $25.00</p><p role="status" id="status"></p><p id="receipt"></p><button id="submit">Submit order</button>
<script>
const pay = document.querySelector('#submit');
const message = document.querySelector('#status');
const key = document.querySelector('#order-id').textContent;
function showReceipt(row) {
  message.textContent = 'Order confirmed';
  document.querySelector('#receipt').textContent = `Receipt #${row.id} for ${row.order_id} — Paid $${(row.amount_cents/100).toFixed(2)}`;
  pay.hidden = true;
}
pay.onclick = async () => {
  pay.disabled = true;
  try {
    const response = await fetch('/checkout', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key})});
    if (!response.ok) throw new Error();
    showReceipt(await response.json());
    history.replaceState(null, '', '#receipt');
  } catch {
    message.textContent = 'Connection lost. Retry to confirm your order.';
    pay.textContent = 'Retry'; pay.disabled = false;
  }
};
if (location.hash === '#receipt') {
  pay.hidden = true;
  message.textContent = 'Loading receipt…';
  fetch('/receipt?key='+key).then(async r => {
    if (!r.ok) throw new Error();
    const receipt = await r.json();
    showReceipt(receipt);
    document.body.dataset.reconciled = key;
  }).catch(() => { document.querySelector('#receipt').textContent = 'Receipt unavailable'; });
}
</script></html>
