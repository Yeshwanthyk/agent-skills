# No router: natural requests that should match a skill by its description. Skills with
# disable-model-invocation are reachable only through the router or a slash command, so their cases run with the router on.

[[case]]
id = "direct-how"
prompt = "Explain how carrier webhook events flow through webhooks.py."
expect = { methods = ["how"], no_edits = true }

[[case]]
id = "direct-history"
prompt = "What's the history behind the retry cap in retry.py? Was there an incident?"
expect = { methods = ["how"], no_edits = true }

[[case]]
id = "direct-diagnose"
prompt = "tests/test_webhooks.py fails. Diagnose why; don't fix it."
expect = { methods = ["diagnose"], no_edits = true }
notes = "Small diagnose-only task without the router; checks the skill loads instead of being skipped as easy."

[[case]]
id = "direct-blast-radius"
activation = "router"
prompt = "Before I touch webhooks.py's DELIVERIES list, what downstream code could break?"
expect = { methods = ["blast-radius"], no_edits = true }

[[case]]
id = "direct-unslop"
activation = "router"
tags = ["port"]
prompt = "docs.md reads padded and AI-ish. Clean up the prose without losing any facts."
expect = { methods = ["unslop"] }

[[case]]
id = "direct-sharpen"
activation = "router"
prompt = "Sharpen this before you start: make the price calculation in pricing.py faster."
expect = { methods = ["sharpen"] }

[[case]]
id = "correct-findings-only"
activation = "router"
tags = ["port"]
prompt = "Use the correct skill on this repo. Report the repeated mistake classes and the level you'd fix each at, but don't change anything yet."
expect = { methods = ["correct"], no_edits = true }
