# Skills changed in the pstack 0.15.9 port. Activation is left to --activation
# so each case runs both with and without the router.

[[case]]
id = "port-understand-state"
tags = ["port"]
prompt = "I'm reviewing a change to state.py next week. Help me really understand the order state machine: what it is, how it works, and why it's shaped this way."
expect = { methods = ["how"], no_edits = true }

[[case]]
id = "port-correct-natural"
tags = ["port"]
prompt = "I keep correcting agents in this repo for the same kinds of mistakes. Find the recurring patterns in the history and tell me how you'd make each one impossible to repeat. Don't change anything yet."
expect = { methods = ["correct"], no_edits = true }

[[case]]
id = "port-unslop-new-doc"
activation = "router"
tags = ["port"]
prompt = "Write a short how-to section in README.md for running the pricing benchmark and reading its output."
expect = { methods = ["unslop"], edits_any = ["README.md"] }

[[case]]
id = "port-vet-speedup"
activation = "router"
tags = ["port"]
prompt = "I tweaked pricing and bench.py dropped from 170ms to 0.4ms. Before I put that number in the PR, is it trustworthy? Don't change code."
expect = { methods = ["benchmark-checklist"], no_edits = true }

[[case]]
id = "port-architect-agent-proof"
activation = "router"
tags = ["port"]
prompt = "Agents keep adding new order states by editing TRANSITIONS in one place and forgetting the others. Pick a structure for the state machine that makes that mistake impossible. Design only."
expect = { any_method = ["architect", "correct"], no_edits = true }

# pstack 0.15.27 port: formal verification skill.
[[case]]
id = "port-formal-verify-skill"
activation = "router"
tags = ["port"]
prompt = "Formally verify that two concurrent retries of the payment job can never charge the same order twice, and leave something the next agent can rerun on every change."
expect = { methods = ["formal-verification-skill"] }
notes = "formal-verification-skill is user-invoked, so the case needs the router."

[[case]]
id = "formal-statechart-check"
activation = "router"
prompt = "Draw the coupon redeem flow as a state diagram, then model-check that two browser tabs can never both apply the same coupon, and show me which paths work and which break."
expect = { methods = ["invariants"], reads = ["invariants/references/formal-modeling.md"] }
notes = "The statechart -> TLC -> marked statechart path: the Formal sub-branch must be reached from a race on a drawn flow."

[[case]]
id = "port-model-only-stays-invariants"
tags = ["port"]
prompt = "Model the order state machine and tell me which transitions can race. Don't write any code yet."
expect = { methods = ["invariants"], no_edits = true }

# pstack 0.15.36 port: drift upkeep for a formal verify skill, and the chart-versus-model check.
[[case]]
id = "port-formal-drift"
activation = "router"
tags = ["port"]
prompt = "Three refactors to the payment retry code merged since anyone last ran its formal check. Is the model still true to the code? Don't change product code."
expect = { methods = ["formal-verification-skill"] }
notes = "Audit of a formal verify skill: the drift loop (sync commit, classify each change, stale pass) lives in formal-verification-skill."

[[case]]
id = "formal-chart-disagreement"
activation = "router"
tier = "task"
prompt = "Draw the order lifecycle in orders/state.py as a statechart from what a customer should see, model-check it against the code with TLA+, and tell me every step the code can take that the chart doesn't show. No product code changes."
expect = { methods = ["invariants"], reads = ["invariants/references/formal-modeling.md", "invariants/references/model-checkers.md"] }
notes = "The arrow comparison (undrawn steps, arrows never taken) is in model-checkers.md, one hop past formal-modeling.md."

# Session audit 2026-11-03: the formal branch was reached twice and ran no check.
[[case]]
id = "formal-ends-red-on-break"
activation = "router"
tier = "task"
prompt = "Model-check this retry race in the payment job and leave a verify skill for it."
expect = { methods = ["formal-verification-skill"], answer = ["scratch|broken variant|mutant", "red|fail|counterexample"] }
notes = "Done means the check was seen red on a scratch break and back at baseline, not a planned model or a statechart."
