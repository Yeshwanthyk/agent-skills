<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width">
<style>
body{margin:0;padding:16px;font:13px/1.5 ui-monospace,monospace;color:#e9e6e1}
h1{font-size:13px;font-weight:600;margin:0 0 12px}
pre.mermaid{margin:0 0 16px;text-align:center;white-space:pre-wrap;color:#8a857e;
  --pele-bg:transparent;--pele-fg:#e9e6e1;--pele-muted:#8a857e;--pele-line:#8a857e;--pele-surface:#141414;
  --pele-surface-alt:#1c1c1c;--pele-border:#57534e;--pele-accent:#e6b04f;--pele-font:ui-monospace,monospace}
pre.mermaid svg{max-width:100%;height:auto}
</style></head><body>
<h1>TITLE</h1>
<pre class="mermaid">
MERMAID SOURCE (escape < and & as &lt; and &amp;)
</pre>
<script type="module">
// A static import holds the load event, so html_preview's screenshot shows the drawn diagram.
// mount() draws synchronously, shows a parse error in place, and gives each diagram its own id prefix.
import {mount} from 'https://cdn.jsdelivr.net/npm/pele@1.9.0/+esm';
for (const el of document.querySelectorAll('pre.mermaid')) {
  try { mount(el, el.textContent); } catch (e) { console.error('pele: ' + e.message); }
}
</script>
</body></html>
