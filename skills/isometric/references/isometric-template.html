<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:">
  <title>Isometric Codebase Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #efe6d2;
      --paper-2: #e4d9bf;
      --ink: #1c1c1c;
      --muted: #6a6458;
      --line: #8d8678;
      --accent: #1c1c1c;
      --panel: rgba(245, 238, 222, 0.94);
      --shadow: rgba(47, 42, 31, 0.16);
      --lime: #c5d46c;
      --blue: #8eb4d4;
      --peach: #e0b08a;
      --tan: #d4c4a0;
      --olive: #b7b48a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    button { font: inherit; }

    .shell {
      min-width: 1180px;
      height: 100vh;
      padding-top: 58px;
      background:
        linear-gradient(rgba(69, 77, 71, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(69, 77, 71, 0.04) 1px, transparent 1px),
        var(--paper);
      background-size: 16px 16px;
    }

    .topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 58px;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto auto;
      align-items: center;
      gap: 18px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(28, 28, 28, 0.45);
      background: rgba(239, 230, 210, 0.97);
      z-index: 10;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--ink);
      background:
        repeating-linear-gradient(135deg, transparent 0 3px, rgba(28, 28, 28, 0.16) 3px 4px),
        #dfd4b8;
      font-size: 16px;
    }

    .brand-copy { min-width: 0; }

    .brand h1 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand p {
      margin: 3px 0 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      align-items: stretch;
      border-left: 1px solid rgba(28, 28, 28, 0.28);
    }

    .stat {
      min-width: 92px;
      padding: 2px 14px;
      border-right: 1px solid rgba(28, 28, 28, 0.28);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 14px;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(28, 28, 28, 0.7);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .control:hover,
    .control:focus-visible {
      outline: none;
      background: var(--ink);
      color: var(--paper);
    }

    .control.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .app {
      height: calc(100vh - 58px);
      min-height: 0;
      display: grid;
      grid-template-columns: 268px minmax(560px, 1fr) 352px;
    }

    .rail,
    .detail {
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 28, 28, 0.28) transparent;
    }

    .rail {
      border-right: 1px solid rgba(28, 28, 28, 0.4);
      padding: 16px 12px 24px;
    }

    .detail {
      border-left: 1px solid rgba(28, 28, 28, 0.4);
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .detail-scroll {
      padding: 18px 20px 32px;
      overflow: auto;
      min-height: 0;
      flex: 1;
    }

    .rail-heading,
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .system-blurb {
      margin: 0 7px 16px;
      color: #4a463c;
      font-size: 11px;
      line-height: 1.45;
    }

    .group { margin-bottom: 16px; }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 7px 6px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .swatch {
      width: 8px;
      height: 8px;
      border: 1px solid rgba(28, 28, 28, 0.55);
    }

    .structure-link {
      width: 100%;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      margin: 1px 0;
      padding: 3px 6px;
      border: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .structure-link:hover,
    .structure-link:focus-visible {
      outline: none;
      border-color: rgba(28, 28, 28, 0.35);
      background: rgba(255, 252, 244, 0.75);
    }

    .structure-link.active {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .structure-link.active .loc { color: rgba(239, 230, 210, 0.72); }

    .code-chip {
      width: 26px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(28, 28, 28, 0.55);
      background: var(--chip, #ddd4bf);
      font-size: 9px;
      font-weight: 900;
    }

    .structure-link.active .code-chip {
      border-color: var(--paper);
      color: var(--ink);
    }

    .structure-link .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
    }

    .structure-link .loc {
      color: var(--muted);
      font-size: 9px;
    }

    .rail-legend {
      margin: 18px 7px 0;
      padding-top: 12px;
      border-top: 1px solid rgba(28, 28, 28, 0.2);
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .rail-legend span { display: flex; align-items: center; gap: 8px; }
    .rail-legend i { width: 10px; height: 10px; border: 1px solid rgba(28, 28, 28, 0.5); display: inline-block; }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        repeating-linear-gradient(30deg, transparent 0 11px, rgba(65, 75, 69, 0.04) 11px 12px),
        repeating-linear-gradient(150deg, transparent 0 11px, rgba(65, 75, 69, 0.03) 11px 12px),
        radial-gradient(circle at 50% 42%, rgba(255, 252, 240, 0.82), rgba(226, 216, 190, 0.55));
      cursor: grab;
    }

    .stage.dragging { cursor: grabbing; }

    #map {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .ground-line {
      fill: none;
      stroke: rgba(66, 73, 69, 0.13);
      stroke-width: 1;
    }

    .zone-box {
      fill: none;
      stroke: rgba(28, 28, 28, 0.18);
      stroke-width: 1;
      stroke-dasharray: 5 4;
    }

    .zone-label {
      fill: rgba(52, 61, 57, 0.38);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .edge-line {
      fill: none;
      stroke: rgba(28, 28, 28, 0.48);
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }

    .edge-line.flow { stroke: rgba(28, 28, 28, 0.72); }
    .edge-line.dashed { stroke-dasharray: 5 5; stroke: rgba(83, 81, 70, 0.5); }
    .edge-line.active { stroke: var(--ink); stroke-width: 2.6; }
    .edge-line.trace-complete { stroke: #7a5a2b; stroke-width: 2.2; opacity: 0.9; }
    .edge-line.trace-current { stroke: var(--ink); stroke-width: 3.4; opacity: 1; }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 12;
      pointer-events: stroke;
      cursor: help;
    }

    .flow-dot {
      fill: #f4e27a;
      stroke: #1c1c1c;
      stroke-width: 1;
      pointer-events: all;
    }

    .structure { cursor: pointer; transition: opacity 140ms ease; }
    .structure:focus-visible { outline: none; }
    .structure .face { stroke: rgba(28, 28, 28, 0.78); stroke-width: 1.05; vector-effect: non-scaling-stroke; }
    .structure .top { filter: url(#paper-shadow); }

    .structure:hover .face,
    .structure.active .face,
    .structure:focus-visible .face {
      stroke: var(--ink);
      stroke-width: 2.2;
    }

    .structure.dimmed { opacity: 0.28; }

    .structure.trace-complete .face {
      stroke: #7a5a2b;
      stroke-width: 2;
    }

    .structure.trace-current {
      filter: drop-shadow(0 0 7px rgba(28, 28, 28, 0.28));
    }

    .structure.trace-current .face {
      stroke: var(--ink);
      stroke-width: 2.8;
    }

    .block-code {
      fill: #1c1c1c;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .block-name {
      fill: rgba(28, 28, 28, 0.82);
      font-size: 8px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }

    .block-loc {
      fill: rgba(28, 28, 28, 0.55);
      font-size: 7px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }

    .block-tick {
      fill: var(--ink);
      pointer-events: none;
    }

    .external-line {
      fill: none;
      stroke: rgba(78, 79, 70, 0.55);
      stroke-width: 1.2;
      stroke-dasharray: 4 5;
    }

    .external-card {
      fill: rgba(249, 246, 237, 0.96);
      stroke: rgba(28, 28, 28, 0.7);
      stroke-width: 1;
    }

    .external-name {
      fill: var(--ink);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .external-pay {
      fill: var(--muted);
      font-size: 8px;
    }

    .tooltip {
      position: fixed;
      z-index: 30;
      width: 248px;
      padding: 11px 12px;
      border: 1px solid var(--ink);
      background: #fffaf0;
      box-shadow: 4px 4px 0 rgba(28, 28, 28, 0.12);
      pointer-events: none;
      opacity: 0;
      transform: translate(10px, 10px);
    }

    .tooltip.show { opacity: 1; }
    .tooltip strong { display: block; margin-bottom: 5px; font-size: 12px; }
    .tooltip span { color: var(--muted); font-size: 10px; line-height: 1.45; }

    .detail h2 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .detail-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .detail-meta span {
      padding: 3px 6px;
      border: 1px solid rgba(28, 28, 28, 0.32);
      background: rgba(255, 252, 244, 0.65);
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 4px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-row b {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
    }

    .detail-tabs {
      display: flex;
      border-bottom: 1px solid rgba(28, 28, 28, 0.35);
      background: rgba(239, 230, 210, 0.9);
    }

    .detail-tab {
      flex: 1;
      min-height: 36px;
      border: 0;
      border-right: 1px solid rgba(28, 28, 28, 0.2);
      background: transparent;
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .detail-tab.active {
      background: var(--ink);
      color: var(--paper);
    }

    .detail-section {
      padding: 14px 0;
      border-top: 1px solid rgba(63, 69, 66, 0.2);
    }

    .detail-section h3 {
      margin: 0 0 8px;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .detail-section p,
    .detail-section li {
      margin: 0;
      color: #3f3c35;
      font-size: 12px;
      line-height: 1.65;
    }

    .detail-section ul { margin: 0; padding-left: 16px; }

    .term {
      display: inline;
      padding: 0 5px 1px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.01em;
    }

    .inside-button {
      width: 100%;
      min-height: 40px;
      margin-top: 14px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .inside-button:hover,
    .inside-button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .trace-card {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 42px;
      z-index: 8;
      display: none;
      grid-template-columns: 120px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px 16px;
      min-height: 128px;
      padding: 12px 14px 10px;
      border: 1px solid var(--ink);
      background: rgba(255, 250, 240, 0.96);
      box-shadow: 5px 5px 0 rgba(28, 28, 28, 0.12);
    }

    .trace-card.show { display: grid; }

    .trace-count {
      min-width: 110px;
      color: var(--ink);
      font-weight: 900;
    }

    .trace-count small,
    .trace-count span {
      display: block;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .trace-count b { display: block; margin: 2px 0 3px; font-size: 20px; }
    .trace-copy strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .trace-copy span { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .trace-actions { display: flex; gap: 6px; }

    .trace-actions button {
      min-width: 68px;
      height: 30px;
      padding: 0 8px;
      border: 1px solid rgba(28, 28, 28, 0.5);
      background: transparent;
      cursor: pointer;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .trace-actions button:hover,
    .trace-actions button:focus-visible { outline: none; background: var(--ink); color: var(--paper); }
    .trace-actions button:disabled { cursor: default; opacity: 0.3; }

    .trace-timeline {
      position: relative;
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(var(--trace-count), minmax(36px, 1fr));
      gap: 4px;
      padding-top: 12px;
      border-top: 1px solid rgba(63, 69, 66, 0.24);
    }

    .trace-timeline::before {
      position: absolute;
      top: 25px;
      right: 18px;
      left: 18px;
      height: 2px;
      background: rgba(28, 28, 28, 0.16);
      content: "";
    }

    .trace-step {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .trace-dot {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(28, 28, 28, 0.35);
      border-radius: 50%;
      background: #fffaf0;
      font-size: 9px;
      font-weight: 900;
    }

    .trace-step.complete .trace-dot { border-color: #7a5a2b; background: #7a5a2b; color: #fffaf0; }
    .trace-step.current .trace-dot { border-color: var(--ink); background: var(--ink); color: var(--paper); box-shadow: 0 0 0 3px rgba(28, 28, 28, 0.12); }
    .trace-step-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 8px;
      font-weight: 800;
    }
    .trace-step.current .trace-step-label { color: var(--ink); }
    .trace-step:hover .trace-step-label,
    .trace-step:focus-visible .trace-step-label { color: var(--ink); }
    .trace-step:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    .panel-trace {
      margin-top: 8px;
      padding: 0;
      list-style: none;
    }

    .panel-trace li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      padding: 5px 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .panel-trace li.done { color: #3f3c35; }
    .panel-trace li.now {
      background: var(--ink);
      color: var(--paper);
    }

    .inside-title { fill: var(--ink); font-size: 22px; font-weight: 700; }
    .inside-note { fill: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
    .inside-boundary {
      fill: rgba(255, 252, 244, 0.28);
      stroke: rgba(56, 64, 60, 0.36);
      stroke-width: 1.2;
      stroke-dasharray: 8 6;
    }

    .inside-back {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 9;
      display: none;
    }

    .inside-back.show { display: block; }

    .legend {
      position: absolute;
      right: 52px;
      top: 12px;
      display: flex;
      gap: 12px;
      padding: 6px 8px;
      border: 1px solid rgba(28, 28, 28, 0.22);
      background: rgba(249, 246, 237, 0.78);
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .legend i {
      width: 16px;
      height: 2px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
      background: rgba(28, 28, 28, 0.7);
    }

    .legend i.dashed {
      background: repeating-linear-gradient(90deg, rgba(83, 81, 70, 0.7) 0 4px, transparent 4px 7px);
    }

    .zoom-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 9;
      display: grid;
      gap: 4px;
    }

    .zoom-controls .control {
      min-width: 30px;
      min-height: 28px;
      padding: 0;
    }

    .hintbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 7;
      display: flex;
      gap: 14px;
      justify-content: center;
      padding: 7px 12px;
      border-top: 1px solid rgba(28, 28, 28, 0.2);
      background: rgba(239, 230, 210, 0.88);
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">&#128506;</div>
        <div class="brand-copy">
          <h1 id="page-title"></h1>
          <p id="page-subtitle"></p>
        </div>
      </div>
      <div class="stats" id="stats" aria-label="Repository statistics"></div>
      <div class="top-actions">
        <button class="control" id="pause-button" type="button">Pause flow</button>
        <button class="control primary" id="trace-button" type="button">Trace one step</button>
        <button class="control" id="overview-button" type="button">Reset view</button>
      </div>
    </header>

    <div class="app">
      <aside class="rail" aria-label="Repository structures">
        <p class="rail-heading">The system</p>
        <p class="system-blurb" id="system-blurb"></p>
        <nav id="structure-nav"></nav>
        <div class="rail-legend" aria-hidden="true">
          <span><i style="background:#c5d46c"></i>entry / ui</span>
          <span><i style="background:#8eb4d4"></i>control plane</span>
          <span><i style="background:#e0b08a"></i>agent data plane</span>
          <span><i style="background:#d4c4a0"></i>storage</span>
        </div>
      </aside>

      <main class="stage" id="stage">
        <svg id="map" viewBox="0 0 1000 790" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Interactive isometric architecture map">
          <defs>
            <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="160%">
              <feDropShadow dx="2" dy="4" stdDeviation="2.4" flood-color="#3b392f" flood-opacity="0.14"></feDropShadow>
            </filter>
            <pattern id="fine-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-opacity="0.14" stroke-width="1"></line>
            </pattern>

              <line x1="0" y1="0" x2="0" y2="5" stroke="#1c1c1c" stroke-opacity="0.22" stroke-width="1"></line>
            </pattern>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script>
  "use strict";

  /* ========================================================================
     DATA — REPLACE ONLY THIS SECTION FOR A NEW REPOSITORY

     STRUCTURES fields:
       id, code, name, group, loc, gx, gy, w, d, h, what, how, talks
       optional slab:true
       optional children:[{code,name,h,what}]

     EDGES fields:
       f, t, pay
       optional flow:1, dashed:1, via:[[gx,gy], ...]

     EXTERNALS fields:
       id, name, target, gx, gy, pay

     TRACE contains 10-14 [structureId, sentence] entries.
     Keep structure footprints disjoint and all IDs stable across updates.
     ======================================================================== */

  const SAMPLE_DATA = true;

  const TITLE = "Isometric Template";
  const SUBTITLE = "Replace this sample with measured repository facts";

  const STATS = [
    { value: "12,345", label: "source LOC" },
    { value: "24", label: "routes" },
    { value: "86", label: "test files" },
    { value: "3", label: "deployed services" }
  ];

  const GROUPS = [
    { id: "surface", name: "User surfaces", color: "#d8a14a", labelGX: 5, labelGY: -1 },
    { id: "entry", name: "Entry and access", color: "#c86a52", labelGX: 4, labelGY: 4 },
    { id: "domain", name: "Core domain", color: "#6f9d83", labelGX: -1, labelGY: 9 },
    { id: "compute", name: "Compute and automation", color: "#6689a6", labelGX: 13, labelGY: 10 },
    { id: "data", name: "Data stores", color: "#9a8eb4", labelGX: 9, labelGY: 19 },
    { id: "delivery", name: "Delivery", color: "#8b9272", labelGX: 1, labelGY: 14 }
  ];

  const STRUCTURES = [
    { id: "web", code: "WB", name: "Web surface", group: "surface", loc: "1.8k LOC", gx: 2, gy: 0, w: 3, d: 2, h: 4, what: "The main browser experience where people start and review work.", how: "A component-based client bundles routes, view state, and typed server calls.", talks: ["gateway"] },
    { id: "admin", code: "AD", name: "Admin surface", group: "surface", loc: "780 LOC", gx: 7, gy: 0, w: 2, d: 2, h: 3, what: "A smaller operator view for reviewing system activity.", how: "Protected screens reuse the client shell with a narrower route set.", talks: ["gateway"] },
    { id: "client", code: "CL", name: "Client package", group: "surface", loc: "640 LOC", gx: 11, gy: 0, w: 2, d: 2, h: 3, what: "A reusable client that lets other software call the system.", how: "Typed request helpers and response models wrap the public server contract.", talks: ["gateway"] },
    { id: "auth", code: "AU", name: "Access checks", group: "entry", loc: "520 LOC", gx: 1, gy: 4, w: 2, d: 2, h: 3, what: "Checks who may make a request and what they are allowed to do.", how: "Middleware resolves an identity and applies capability rules before domain work begins.", talks: ["gateway"] },
    { id: "gateway", code: "GW", name: "Request gateway", group: "entry", loc: "2.4k LOC", gx: 5, gy: 4, w: 3, d: 2, h: 6, what: "Receives requests, validates input, and sends work to the right domain capability.", how: "Routers bind validation, access checks, handlers, and response serialization.", talks: ["auth", "core", "ingest"] },
    { id: "ingest", code: "IN", name: "Ingestion", group: "domain", loc: "1.6k LOC", gx: 1, gy: 8, w: 3, d: 3, h: 5, what: "Turns uploaded material into normalized records the rest of the system can use.", how: "Parsers identify input types, normalize content, and enqueue expensive follow-up work.", talks: ["queue", "objects"] },
    { id: "core", code: "CO", name: "Core domain", group: "domain", loc: "4.9k LOC", gx: 7, gy: 7, w: 4, d: 3, h: 8, what: "Holds the business rules that coordinate the repository's central job.", how: "Application services combine domain models, policies, repositories, and typed commands.", talks: ["queue", "database", "cache"], children: [
      { code: "MD", name: "Domain models", h: 5, what: "Represent the main concepts and their invariants." },
      { code: "UC", name: "Use cases", h: 7, what: "Coordinate each user-visible operation." },
      { code: "PL", name: "Policies", h: 4, what: "Centralize decisions and eligibility rules." },
      { code: "RP", name: "Repositories", h: 5, what: "Define storage-facing interfaces for domain data." },
      { code: "EV", name: "Events", h: 3, what: "Describe completed work for downstream consumers." }
    ] },
    { id: "agent", code: "AG", name: "Automation engine", group: "compute", loc: "3.5k LOC", gx: 13, gy: 6, w: 3, d: 3, h: 7, what: "Plans and executes multi-step automated work on behalf of a request.", how: "An orchestration loop selects tools, tracks state, and converts provider output into domain commands.", talks: ["core", "search"] },
    { id: "queue", code: "QU", name: "Work queue", group: "data", loc: "role", gx: 5, gy: 12, w: 3, d: 2, h: 1, slab: true, what: "Buffers slower jobs so requests do not wait for all processing to finish.", how: "A generic queue boundary carries job envelopes between producers and workers.", talks: ["worker"] },
    { id: "worker", code: "WK", name: "Background worker", group: "compute", loc: "2.1k LOC", gx: 9, gy: 12, w: 3, d: 3, h: 6, what: "Runs longer jobs and records their results outside the request cycle.", how: "Consumers claim typed jobs, call domain operations, and acknowledge or retry outcomes.", talks: ["agent", "database", "search"] },
    { id: "search", code: "SR", name: "Search index", group: "data", loc: "920 LOC", gx: 14, gy: 11, w: 2, d: 2, h: 4, what: "Makes normalized content quickly retrievable for automation and user search.", how: "Index adapters write document records and execute ranked retrieval queries.", talks: ["objects"] },
    { id: "database", code: "DB", name: "Primary database", group: "data", loc: "data", gx: 5, gy: 16, w: 4, d: 2, h: 1, slab: true, what: "Stores durable application records and processing state.", how: "Repository implementations translate domain operations into transactional persistence.", talks: [] },
    { id: "cache", code: "CA", name: "Transient cache", group: "data", loc: "data", gx: 10, gy: 16, w: 3, d: 2, h: 1, slab: true, what: "Keeps short-lived results close to the compute path.", how: "Keyed entries reduce repeated reads and expire when their freshness window ends.", talks: [] },
    { id: "objects", code: "OB", name: "Object storage", group: "data", loc: "data", gx: 14, gy: 16, w: 3, d: 2, h: 1, slab: true, what: "Holds larger uploaded and generated files outside the primary database.", how: "Storage adapters read and write opaque objects through generic references.", talks: [] },
    { id: "ci", code: "CI", name: "Build and checks", group: "delivery", loc: "31 files", gx: 0, gy: 15, w: 3, d: 2, h: 2, what: "Checks changes and prepares deployable outputs.", how: "Automated jobs run formatting, tests, builds, and packaging from versioned configuration.", talks: ["web", "gateway", "worker"] }
  ];

  const EDGES = [
    { f: "web", t: "gateway", flow: 1, pay: "Validated request" },
    { f: "admin", t: "gateway", flow: 1, pay: "Operator action" },
    { f: "client", t: "gateway", flow: 1, pay: "Typed request" },
    { f: "gateway", t: "auth", flow: 1, pay: "Identity context" },
    { f: "gateway", t: "core", flow: 1, pay: "Domain command" },
    { f: "gateway", t: "ingest", flow: 1, pay: "Input reference" },
    { f: "ingest", t: "queue", flow: 1, pay: "Processing job" },
    { f: "ingest", t: "objects", flow: 1, pay: "Normalized file", via: [[3, 13], [13, 13]] },
    { f: "core", t: "queue", flow: 1, pay: "Deferred work" },
    { f: "queue", t: "worker", flow: 1, pay: "Job envelope" },
    { f: "worker", t: "agent", flow: 1, pay: "Automation task", via: [[13, 14], [16, 10]] },
    { f: "agent", t: "core", flow: 1, pay: "Domain update" },
    { f: "agent", t: "search", flow: 1, pay: "Retrieval query" },
    { f: "core", t: "database", flow: 1, pay: "Records" },
    { f: "core", t: "cache", flow: 1, pay: "Cached result" },
    { f: "worker", t: "database", flow: 1, pay: "Job status" },
    { f: "search", t: "objects", flow: 1, pay: "Content reference" },
    { f: "ci", t: "web", dashed: 1, pay: "Build checks" },
    { f: "ci", t: "gateway", dashed: 1, pay: "Server checks" },
    { f: "ci", t: "worker", dashed: 1, pay: "Worker checks", via: [[2, 14], [8, 14]] }
  ];

  const EXTERNALS = [
    { id: "identity-provider", name: "Identity provider", target: "auth", gx: -3, gy: 5, pay: "Identity assertion" },
    { id: "model-provider", name: "Model provider", target: "agent", gx: 19, gy: 5, pay: "Prompt and response" },
    { id: "external-saas", name: "External SaaS", target: "worker", gx: 18, gy: 12, pay: "Task exchange" }
  ];

  const TRACE = [
    ["web", "A person submits work from the main browser surface."],
    ["gateway", "The gateway validates the request and chooses a handler."],
    ["auth", "Access checks resolve identity and permissions."],
    ["core", "The core domain validates the command against business rules."],
    ["queue", "Long-running work is placed on the asynchronous queue."],
    ["worker", "A background worker claims the job and restores its context."],
    ["agent", "The automation engine plans the requested multi-step work."],
    ["search", "Relevant normalized content is retrieved for the task."],
    ["database", "Durable results and status are committed."],
    ["web", "The browser receives the completed state and presents the result."]
  ];

  const OVERVIEW_WHAT = "Sample repository turns user requests and uploaded material into durable, searchable work. Interactive surfaces hand validated commands to a central domain, while longer tasks continue through workers and automation.";
  const OVERVIEW_HOW = "The system separates entry points, business rules, background compute, and storage behind typed boundaries. Synchronous calls provide fast feedback; queued jobs handle slower processing; adapters isolate external providers and data stores.";

  /* ============================== END DATA ============================== */

  (function () {
    const NS = "http:" + "//www.w3.org/2000/svg";
    const VIEW_W = 1000;
    const VIEW_H = 790;
    const ORIGIN_X = 493;
    const ORIGIN_Y = 175;
    const ISO_X = 26;
    const ISO_Y = 14.3;
    const ISO_H = 16;

    const svg = document.getElementById("map");
    const nav = document.getElementById("structure-nav");
    const detail = document.getElementById("detail");
    const tooltip = document.getElementById("tooltip");
    const traceCard = document.getElementById("trace-card");
    const insideBack = document.getElementById("inside-back");
    const groupById = new Map(GROUPS.map((group) => [group.id, group]));
    const structureById = new Map(STRUCTURES.map((structure) => [structure.id, structure]));
    let selectedId = null;
    let insideId = null;
    let traceIndex = null;
    let flowPaused = false;
    let detailTab = "what";
    let view = { x: 0, y: 0, k: 1 };
    let dragging = false;
    let dragOrigin = null;
    const structureOrder = STRUCTURES.map((structure) => structure.id);

    function esc(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function rich(value) {
      return esc(value)
        .replaceAll("«", "<b class=\"term\">")
        .replaceAll("»", "</b>");
    }

    function syncView() {
      const width = VIEW_W / view.k;
      const height = VIEW_H / view.k;
      svg.setAttribute("viewBox", view.x + " " + view.y + " " + width + " " + height);
    }

    function setPaused(paused) {
      flowPaused = paused;
      if (paused) svg.pauseAnimations();
      else svg.unpauseAnimations();
      const button = document.getElementById("pause-button");
      if (button) button.textContent = paused ? "Resume flow" : "Pause flow";
    }

    function svgEl(name, attrs, text) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, String(value)));
      if (text !== undefined) node.textContent = String(text);
      return node;
    }

    function project(gx, gy, h) {
      return [ORIGIN_X + (gx - gy) * ISO_X, ORIGIN_Y + (gx + gy) * ISO_Y - h * ISO_H];
    }

    function points(values) {
      return values.map((point) => point.join(",")).join(" ");
    }

    function shade(hex, amount) {
      const raw = hex.replace("#", "");
      const value = parseInt(raw, 16);
      const r = Math.max(0, Math.min(255, (value >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((value >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (value & 255) + amount));
      return `rgb(${r},${g},${b})`;
    }

    function structureCenter(structure) {
      return {
        gx: structure.gx + structure.w / 2,
        gy: structure.gy + structure.d / 2
      };
    }

    function clearDrawing() {
      svg.querySelectorAll(".drawing-layer").forEach((node) => node.remove());
    }

    function makeLayer(name) {
      const layer = svgEl("g", { class: `drawing-layer ${name}` });
      svg.appendChild(layer);
      return layer;
    }

    function drawGround(layer) {
      for (let i = -6; i <= 26; i += 1) {
        const a = project(i, -5, 0);
        const b = project(i, 24, 0);
        layer.appendChild(svgEl("line", { class: "ground-line", x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
      }
      for (let i = -5; i <= 24; i += 1) {
        const a = project(-6, i, 0);
        const b = project(26, i, 0);
        layer.appendChild(svgEl("line", { class: "ground-line", x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
      }
    }

    function drawZoneBoxes(layer) {
      GROUPS.forEach((group) => {
        const members = STRUCTURES.filter((structure) => structure.group === group.id);
        if (members.length < 2) return;
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        members.forEach((structure) => {
          minX = Math.min(minX, structure.gx - 0.45);
          minY = Math.min(minY, structure.gy - 0.45);
          maxX = Math.max(maxX, structure.gx + structure.w + 0.45);
          maxY = Math.max(maxY, structure.gy + structure.d + 0.45);
        });
        const top = project(minX, minY, 0);
        const right = project(maxX, minY, 0);
        const bottom = project(maxX, maxY, 0);
        const left = project(minX, maxY, 0);
        layer.appendChild(svgEl("polygon", { class: "zone-box", points: points([top, right, bottom, left]) }));
      });
    }

    function routeFor(edge) {
      const from = structureById.get(edge.f);
      const to = structureById.get(edge.t);
      if (!from || !to) return null;
      const start = structureCenter(from);
      const end = structureCenter(to);
      const logical = [
        [start.gx, start.gy],
        ...(edge.via || [[end.gx, start.gy]]),
        [end.gx, end.gy]
      ];
      const projected = logical.map(([gx, gy]) => project(gx, gy, 0.08));
      return `M ${projected.map((point) => `${point[0]} ${point[1]}`).join(" L ")}`;
    }

    function showTooltip(event, title, body) {
      tooltip.innerHTML = `<strong>${esc(title)}</strong><span>${esc(body)}</span>`;
      const left = Math.min(window.innerWidth - 270, event.clientX + 12);
      const top = Math.min(window.innerHeight - 120, event.clientY + 12);
      tooltip.style.left = `${Math.max(10, left)}px`;
      tooltip.style.top = `${Math.max(10, top)}px`;
      tooltip.classList.add("show");
    }

    function hideTooltip() {
      tooltip.classList.remove("show");
    }

    function drawEdges(layer) {
      EDGES.forEach((edge, index) => {
        const d = routeFor(edge);
        if (!d) return;
        const path = svgEl("path", {
          id: `flow-path-${index}`,
          class: `edge-line${edge.flow ? " flow" : ""}${edge.dashed ? " dashed" : ""}`,
          d,
          "data-from": edge.f,
          "data-to": edge.t
        });
        const hit = svgEl("path", { class: "edge-hit", d, tabindex: "0" });
        const describe = (event) => showTooltip(event, `${structureById.get(edge.f).name} → ${structureById.get(edge.t).name}`, edge.pay);
        hit.addEventListener("pointermove", describe);
        hit.addEventListener("pointerleave", hideTooltip);
        hit.addEventListener("focus", (event) => showTooltip({ clientX: window.innerWidth / 2, clientY: 120 }, "Data flow", edge.pay));
        hit.addEventListener("blur", hideTooltip);
        layer.appendChild(path);
        layer.appendChild(hit);

        if (edge.flow) {
          const fromGroup = groupById.get((structureById.get(edge.f) || {}).group) || {};
          [0, 1].forEach((dotIndex) => {
            const circle = svgEl("circle", { class: "flow-dot", r: 3.6, fill: fromGroup.color || "#f4e27a", "data-pay": edge.pay });
            const motion = svgEl("animateMotion", {
              path: d,
              dur: `${5.5 + (index % 4) * 0.8}s`,
              begin: `${dotIndex * -2.7}s`,
              repeatCount: "indefinite"
            });
            circle.appendChild(motion);
            circle.addEventListener("pointermove", (event) => showTooltip(event, "In transit", edge.pay));
            circle.addEventListener("pointerleave", hideTooltip);
            layer.appendChild(circle);
          });
        }
      });
    }

    function blockGeometry(structure) {
      const height = structure.slab ? Math.max(0.55, structure.h) : structure.h;
      const topA = project(structure.gx, structure.gy, height);
      const topB = project(structure.gx + structure.w, structure.gy, height);
      const topC = project(structure.gx + structure.w, structure.gy + structure.d, height);
      const topD = project(structure.gx, structure.gy + structure.d, height);
      const baseB = project(structure.gx + structure.w, structure.gy, 0);
      const baseC = project(structure.gx + structure.w, structure.gy + structure.d, 0);
      const baseD = project(structure.gx, structure.gy + structure.d, 0);
      return { height, topA, topB, topC, topD, baseB, baseC, baseD };
    }

    function drawBlock(layer, structure, options) {
      const settings = options || {};
      const group = groupById.get(structure.group) || { color: "#a69d88" };
      const color = settings.color || group.color;
      const geometry = blockGeometry(structure);
      const node = svgEl("g", {
        class: "structure",
        tabindex: "0",
        role: "button",
        "aria-label": `${structure.name}, ${structure.loc || "internal structure"}`,
        "data-id": structure.id
      });

      node.appendChild(svgEl("polygon", {
        class: "face right",
        points: points([geometry.topB, geometry.topC, geometry.baseC, geometry.baseB]),
        fill: shade(color, -42)
      }));
      node.appendChild(svgEl("polygon", {
        points: points([geometry.topB, geometry.topC, geometry.baseC, geometry.baseB]),
        fill: "url(#side-hatch)",
        "pointer-events": "none"
      }));
      node.appendChild(svgEl("polygon", {
        class: "face left",
        points: points([geometry.topC, geometry.topD, geometry.baseD, geometry.baseC]),
        fill: shade(color, -20)
      }));
      node.appendChild(svgEl("polygon", {
        points: points([geometry.topC, geometry.topD, geometry.baseD, geometry.baseC]),
        fill: "url(#left-hatch)",
        "pointer-events": "none"
      }));
      node.appendChild(svgEl("polygon", {
        class: "face top",
        points: points([geometry.topA, geometry.topB, geometry.topC, geometry.topD]),
        fill: color
      }));
      node.appendChild(svgEl("polygon", {
        points: points([geometry.topA, geometry.topB, geometry.topC, geometry.topD]),
        fill: "url(#fine-hatch)",
        "pointer-events": "none"
      }));

      const topCenter = project(structure.gx + structure.w / 2, structure.gy + structure.d / 2, geometry.height);
      const codeAt = project(structure.gx + 0.38, structure.gy + 0.28, geometry.height);
      node.appendChild(svgEl("text", { class: "block-code", x: codeAt[0], y: codeAt[1] + 3 }, structure.code));
      if (!structure.slab && structure.w >= 3) {
        node.appendChild(svgEl("text", { class: "block-name", x: topCenter[0], y: topCenter[1] + 10 }, structure.name));
      }
      node.appendChild(svgEl("text", { class: "block-loc", x: topCenter[0], y: topCenter[1] + (structure.slab ? 4 : 20) }, structure.loc || ""));
      const tick = project(structure.gx + structure.w - 0.22, structure.gy + 0.22, geometry.height);
      node.appendChild(svgEl("rect", { class: "block-tick", x: tick[0] - 2, y: tick[1] - 2, width: 4, height: 4 }));

      const activate = () => settings.onSelect ? settings.onSelect(structure) : selectStructure(structure.id);
      node.addEventListener("click", activate);
      node.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate();
        }
      });
      node.addEventListener("pointermove", (event) => {
        showTooltip(event, `${structure.name} · ${structure.loc || ""}`, structure.what);
        if (!settings.noNeighbors) highlightNeighborhood(structure.id);
      });
      node.addEventListener("pointerleave", () => {
        hideTooltip();
        if (!settings.noNeighbors) applyHighlightState();
      });
      node.addEventListener("focus", () => {
        if (!settings.noNeighbors) highlightNeighborhood(structure.id);
      });
      node.addEventListener("blur", () => {
        if (!settings.noNeighbors) applyHighlightState();
      });
      layer.appendChild(node);
      return node;
    }

    function drawExternals(layer) {
      EXTERNALS.forEach((external) => {
        const target = structureById.get(external.target);
        if (!target) return;
        const targetCenter = structureCenter(target);
        const start = project(external.gx, external.gy, 0.1);
        const end = project(targetCenter.gx, targetCenter.gy, 0.1);
        const width = Math.max(118, external.name.length * 7.2);
        const group = svgEl("g", { tabindex: "0", role: "note" });
        group.appendChild(svgEl("path", { class: "external-line", d: `M ${start[0]} ${start[1]} L ${end[0]} ${end[1]}` }));
        group.appendChild(svgEl("rect", { class: "external-card", x: start[0] - width / 2, y: start[1] - 18, width, height: 35, rx: 2 }));
        group.appendChild(svgEl("text", { class: "external-name", x: start[0], y: start[1] - 3, "text-anchor": "middle" }, external.name));
        group.appendChild(svgEl("text", { class: "external-pay", x: start[0], y: start[1] + 10, "text-anchor": "middle" }, external.pay));
        group.addEventListener("pointermove", (event) => showTooltip(event, external.name, external.pay));
        group.addEventListener("pointerleave", hideTooltip);
        layer.appendChild(group);
      });
    }

    function drawZoneLabels(layer) {
      const labels = GROUPS
        .filter(
          (group) =>
            Number.isFinite(group.labelGX)
            && Number.isFinite(group.labelGY)
        )
        .map((group) => [group.name.toUpperCase(), group.labelGX, group.labelGY]);

      labels.forEach(([label, gx, gy]) => {
        const at = project(gx, gy, 0);
        layer.appendChild(svgEl("text", { class: "zone-label", x: at[0], y: at[1], "text-anchor": "middle" }, label));
      });
    }

    function renderCity() {
      insideId = null;
      insideBack.classList.remove("show");
      clearDrawing();
      const ground = makeLayer("ground-layer");
      const edges = makeLayer("edge-layer");
      const blocks = makeLayer("block-layer");
      const externals = makeLayer("external-layer");
      drawGround(ground);
      drawZoneBoxes(ground);
      drawZoneLabels(ground);
      drawEdges(edges);
      STRUCTURES
        .slice()
        .sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy))
        .forEach((structure) => drawBlock(blocks, structure));
      drawExternals(externals);
      applyHighlightState();
    }

    function renderInside(parent) {
      insideId = parent.id;
      selectedId = parent.id;
      traceIndex = null;
      traceCard.classList.remove("show");
      insideBack.classList.add("show");
      clearDrawing();
      const ground = makeLayer("ground-layer");
      const blocks = makeLayer("block-layer");
      drawGround(ground);

      ground.appendChild(svgEl("rect", { class: "inside-boundary", x: 130, y: 130, width: 740, height: 520, rx: 8 }));
      ground.appendChild(svgEl("text", { class: "inside-title", x: 165, y: 184 }, `Inside ${parent.name}`));
      ground.appendChild(svgEl("text", { class: "inside-note", x: 166, y: 207 }, "COMPONENT RESPONSIBILITIES · HEIGHTS FOLLOW RELATIVE SIZE"));

      const children = parent.children || [];
      children.forEach((child, index) => {
        const column = index % 3;
        const row = Math.floor(index / 3);
        const structure = {
          id: `${parent.id}-child-${index}`,
          code: child.code,
          name: child.name,
          group: parent.group,
          loc: child.loc || "internal",
          gx: 5 + column * 5,
          gy: 8 + row * 6,
          w: 3,
          d: 2.4,
          h: child.h,
          what: child.what,
          how: parent.how,
          talks: []
        };
        drawBlock(blocks, structure, {
          color: (groupById.get(parent.group) || { color: "#9d9480" }).color,
          noNeighbors: true,
          onSelect: () => renderChildDetail(parent, child)
        });
      });
      renderStructureDetail(parent);
      syncNav();
    }

    function highlightNeighborhood(id) {
      const neighbors = new Set([id]);
      EDGES.forEach((edge) => {
        if (edge.f === id) neighbors.add(edge.t);
        if (edge.t === id) neighbors.add(edge.f);
      });
      svg.querySelectorAll(".structure").forEach((node) => {
        node.classList.toggle("dimmed", !neighbors.has(node.dataset.id));
      });
      svg.querySelectorAll(".edge-line").forEach((node) => {
        node.classList.toggle("active", node.dataset.from === id || node.dataset.to === id);
      });
    }

    function applyHighlightState() {
      const active = traceIndex !== null ? TRACE[traceIndex][0] : selectedId;
      const completedIds = traceIndex !== null
        ? new Set(TRACE.slice(0, traceIndex + 1).map(([id]) => id))
        : new Set();
      const transitions = traceIndex !== null
        ? TRACE.slice(1, traceIndex + 1).map(([to], index) => [TRACE[index][0], to])
        : [];
      svg.querySelectorAll(".structure").forEach((node) => {
        const isCurrent = traceIndex !== null && node.dataset.id === active;
        const isComplete = traceIndex !== null && completedIds.has(node.dataset.id) && !isCurrent;
        node.classList.toggle("dimmed", traceIndex !== null && !completedIds.has(node.dataset.id));
        node.classList.toggle("active", traceIndex === null && node.dataset.id === active);
        node.classList.toggle("trace-complete", isComplete);
        node.classList.toggle("trace-current", isCurrent);
      });
      svg.querySelectorAll(".edge-line").forEach((node) => {
        let lastMatch = -1;
        transitions.forEach(([from, to], index) => {
          const matches = (node.dataset.from === from && node.dataset.to === to)
            || (node.dataset.from === to && node.dataset.to === from);
          if (matches) lastMatch = index;
        });
        node.classList.toggle("active", false);
        node.classList.toggle("trace-complete", lastMatch >= 0 && lastMatch < transitions.length - 1);
        node.classList.toggle("trace-current", lastMatch >= 0 && lastMatch === transitions.length - 1);
      });
      syncNav();
    }

    function syncNav() {
      nav.querySelectorAll(".structure-link").forEach((button) => {
        button.classList.toggle("active", button.dataset.id === selectedId);
      });
    }

    function renderNav() {
      nav.textContent = "";
      GROUPS.forEach((group) => {
        const members = STRUCTURES.filter((structure) => structure.group === group.id);
        if (!members.length) return;
        const section = document.createElement("section");
        section.className = "group";
        const title = document.createElement("p");
        title.className = "group-title";
        title.innerHTML = `<span class="swatch" style="background:${esc(group.color)}"></span>${esc(group.name)}`;
        section.appendChild(title);
        members.forEach((structure) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "structure-link";
          button.dataset.id = structure.id;
          button.style.setProperty("--chip", group.color);
          button.innerHTML = `<span class="code-chip">${esc(structure.code)}</span><span class="name">${esc(structure.name)}</span><span class="loc">${esc(structure.loc)}</span>`;
          button.addEventListener("click", () => {
            if (location.hash) history.replaceState(null, "", location.pathname + location.search);
            if (insideId) renderCity();
            traceIndex = null;
            traceCard.classList.remove("show");
            selectStructure(structure.id);
          });
          section.appendChild(button);
        });
        nav.appendChild(section);
      });
    }

    function renderOverview() {
      selectedId = null;
      const body = detailTab === "how"
        ? `<section class="detail-section"><h3>How it is built</h3><p>${rich(OVERVIEW_HOW)}</p></section>
        <section class="detail-section"><h3>How to explore</h3><p>Hover blocks and moving dots for context. Select a structure for details. Trace one step walks a real create request: completed steps dim to brown, the current step is ink-black. Structures with internals offer a go-inside view.</p></section>`
        : `<section class="detail-section"><h3>What it does</h3><p>${rich(OVERVIEW_WHAT)}</p></section>
        <section class="detail-section"><h3>Mapped roles</h3><p>${STRUCTURES.length} structures and ${EDGES.length} connections, sized from measured lines of code. Three deployed services: main Worker, runner Worker, and Container. Storage slabs are KV and R2 roles, not extra services.</p></section>`;
      detail.innerHTML = `
        <p class="eyebrow">System overview</p>
        <h2>${esc(TITLE)}</h2>
        <div class="detail-meta"><span>${STRUCTURES.length} structures</span><span>${EDGES.length} connections</span><span>TS · RS · JS</span></div>
        <div class="status-row"><b></b> nominal · live architecture</div>
        ${body}`;
      syncNav();
      syncTabs();
    }

    function traceListHtml(currentId) {
      if (traceIndex === null) return "";
      const items = TRACE.map(([id, sentence], index) => {
        const step = structureById.get(id);
        const state = index === traceIndex ? " now" : (index < traceIndex ? " done" : "");
        return `<li class="${state}"><span>${String(index + 1).padStart(2, "0")}</span><span>${esc(step ? step.name : id)} — ${esc(sentence)}</span></li>`;
      }).join("");
      return `<section class="detail-section"><h3>Entire trace</h3><ol class="panel-trace">${items}</ol></section>`;
    }

    function renderStructureDetail(structure) {
      const group = groupById.get(structure.group);
      const connections = (structure.talks || [])
        .map((id) => structureById.get(id))
        .filter(Boolean);
      const connectionsHtml = connections.length
        ? `<ul>${connections.map((item) => `<li>${esc(item.name)}</li>`).join("")}</ul>`
        : `<p>No outgoing runtime connection is shown.</p>`;
      const body = detailTab === "how"
        ? `<section class="detail-section"><h3>How it is built</h3><p>${rich(structure.how)}</p></section>
           <section class="detail-section"><h3>Talks to</h3>${connectionsHtml}</section>`
        : `<section class="detail-section"><h3>What it does</h3><p>${rich(structure.what)}</p></section>
           <section class="detail-section"><h3>In the flow</h3><p>${rich(structure.what)}</p></section>`;
      detail.innerHTML = `
        <p class="eyebrow">Selected / ${esc(structure.code)}</p>
        <h2>${esc(structure.name)}</h2>
        <div class="detail-meta"><span>${esc(structure.code)}</span><span>${esc(structure.loc)}</span><span>${esc(group ? group.name : "structure")}</span>${structure.slab ? "<span>storage slab</span>" : ""}</div>
        <div class="status-row"><b></b> nominal</div>
        ${body}
        ${traceListHtml(structure.id)}
        ${structure.children && structure.children.length && insideId !== structure.id ? `<button class="inside-button" id="go-inside" type="button">Go inside · ${structure.children.length} components</button>` : ""}`;
      const insideButton = document.getElementById("go-inside");
      if (insideButton) insideButton.addEventListener("click", () => { location.hash = `inside=${encodeURIComponent(structure.id)}`; });
      syncTabs();
    }

    function renderChildDetail(parent, child) {
      const body = detailTab === "how"
        ? `<section class="detail-section"><h3>Parent implementation</h3><p>${rich(parent.how)}</p></section>`
        : `<section class="detail-section"><h3>What it does</h3><p>${rich(child.what)}</p></section>`;
      detail.innerHTML = `
        <p class="eyebrow">Inside ${esc(parent.name)}</p>
        <h2>${esc(child.name)}</h2>
        <div class="detail-meta"><span>${esc(child.code)}</span><span>internal component</span></div>
        <div class="status-row"><b></b> nominal</div>
        ${body}`;
      syncTabs();
    }

    function selectStructure(id) {
      const structure = structureById.get(id);
      if (!structure) return;
      selectedId = id;
      renderStructureDetail(structure);
      applyHighlightState();
    }

    function renderTrace(index) {
      const safeIndex = Math.max(0, Math.min(TRACE.length - 1, index));
      traceIndex = safeIndex;
      const [id, sentence] = TRACE[safeIndex];
      const structure = structureById.get(id);
      const traceStepsHtml = TRACE.map(([stepId], stepIndex) => {
        const stepStructure = structureById.get(stepId);
        const state = stepIndex === safeIndex ? " current" : (stepIndex < safeIndex ? " complete" : "");
        const label = stepStructure ? stepStructure.code : String(stepIndex + 1);
        const name = stepStructure ? stepStructure.name : stepId;
        return `<button class="trace-step${state}" type="button" data-trace-step="${stepIndex + 1}" aria-label="Go to trace step ${stepIndex + 1}: ${esc(name)}"><span class="trace-dot">${stepIndex + 1}</span><span class="trace-step-label">${esc(label)}</span></button>`;
      }).join("");
      selectedId = id;
      if (insideId) renderCity();
      traceCard.classList.add("show");
      traceCard.innerHTML = `
        <div class="trace-count"><small>Request trace</small><b>${String(safeIndex + 1).padStart(2, "0")} / ${String(TRACE.length).padStart(2, "0")}</b><span>Orange done · red current</span></div>
        <div class="trace-copy"><strong>${esc(structure ? structure.name : id)}</strong><span>${esc(sentence)}</span></div>
        <div class="trace-actions">
          <button type="button" data-trace-action="previous"${safeIndex === 0 ? " disabled" : ""}>← Previous</button>
          <button type="button" data-trace-action="next"${safeIndex === TRACE.length - 1 ? " disabled" : ""}>Next →</button>
          <button type="button" data-trace-action="close">Close</button>
        </div>
        <div class="trace-timeline" style="--trace-count:${TRACE.length}">${traceStepsHtml}</div>`;
      traceCard.querySelector('[data-trace-action="previous"]').addEventListener("click", () => setTrace(Math.max(1, safeIndex)));
      traceCard.querySelector('[data-trace-action="next"]').addEventListener("click", () => setTrace(Math.min(TRACE.length, safeIndex + 2)));
      traceCard.querySelector('[data-trace-action="close"]').addEventListener("click", () => { location.hash = ""; });
      traceCard.querySelectorAll("[data-trace-step]").forEach((button) => {
        button.addEventListener("click", () => setTrace(Number(button.dataset.traceStep)));
      });
      if (structure) renderStructureDetail(structure);
      applyHighlightState();
    }

    function setTrace(oneBasedIndex) {
      location.hash = `trace=${oneBasedIndex}`;
    }

    function applyHash() {
      // Debug hooks: #inside=STRUCTURE_ID and #trace=7.
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      const params = new URLSearchParams(location.hash.slice(1));
      const inside = params.get("inside");
      const trace = Number(params.get("trace"));
      if (inside) {
        const structure = structureById.get(inside);
        if (structure && structure.children && structure.children.length) {
          renderInside(structure);
          return;
        }
      }
      renderCity();
      if (Number.isFinite(trace) && trace >= 1) {
        renderTrace(trace - 1);
      } else {
        traceIndex = null;
        traceCard.classList.remove("show");
        renderOverview();
        applyHighlightState();
      }
    }

    function syncTabs() {
      document.getElementById("tab-what").classList.toggle("active", detailTab === "what");
      document.getElementById("tab-how").classList.toggle("active", detailTab === "how");
    }

    function refreshDetail() {
      if (insideId) {
        const parent = structureById.get(insideId);
        if (parent) renderStructureDetail(parent);
        return;
      }
      if (selectedId) {
        const structure = structureById.get(selectedId);
        if (structure) renderStructureDetail(structure);
        else renderOverview();
      } else {
        renderOverview();
      }
    }

    function zoomBy(factor, clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const cx = clientX == null ? rect.left + rect.width / 2 : clientX;
      const cy = clientY == null ? rect.top + rect.height / 2 : clientY;
      const next = Math.max(0.7, Math.min(2.4, view.k * factor));
      const px = (cx - rect.left) / rect.width;
      const py = (cy - rect.top) / rect.height;
      const worldX = view.x + px * (VIEW_W / view.k);
      const worldY = view.y + py * (VIEW_H / view.k);
      view.k = next;
      view.x = worldX - px * (VIEW_W / view.k);
      view.y = worldY - py * (VIEW_H / view.k);
      syncView();
    }

    function resetCamera() {
      view = { x: 0, y: 0, k: 1 };
      syncView();
    }

    document.getElementById("page-title").textContent = TITLE;
    document.getElementById("page-subtitle").textContent = SUBTITLE;
    document.title = TITLE;
    document.getElementById("system-blurb").textContent = "Pi in a persistent sandbox: one session object owns the record, the container only sees sentinels.";
    document.getElementById("stats").innerHTML = STATS.map((stat) => `<div class="stat"><strong>${esc(stat.value)}</strong><span>${esc(stat.label)}</span></div>`).join("");
    document.getElementById("overview-button").addEventListener("click", () => {
      resetCamera();
      setPaused(false);
      location.hash = "";
    });
    document.getElementById("trace-button").addEventListener("click", () => {
      const next = traceIndex === null ? 1 : Math.min(TRACE.length, traceIndex + 2);
      setTrace(next);
    });
    document.getElementById("pause-button").addEventListener("click", () => setPaused(!flowPaused));
    document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.18));
    document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.18));
    document.getElementById("tab-what").addEventListener("click", () => { detailTab = "what"; refreshDetail(); });
    document.getElementById("tab-how").addEventListener("click", () => { detailTab = "how"; refreshDetail(); });
    insideBack.addEventListener("click", () => { location.hash = ""; });
    window.addEventListener("hashchange", applyHash);

    const stage = document.getElementById("stage");
    stage.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomBy(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.clientX, event.clientY);
    }, { passive: false });
    stage.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      dragging = true;
      stage.classList.add("dragging");
      dragOrigin = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y, k: view.k };
    });
    window.addEventListener("pointermove", (event) => {
      if (!dragging || !dragOrigin) return;
      const rect = svg.getBoundingClientRect();
      view.x = dragOrigin.vx - (event.clientX - dragOrigin.x) * (VIEW_W / dragOrigin.k) / rect.width;
      view.y = dragOrigin.vy - (event.clientY - dragOrigin.y) * (VIEW_H / dragOrigin.k) / rect.height;
      syncView();
    });
    window.addEventListener("pointerup", () => {
      dragging = false;
      stage.classList.remove("dragging");
      dragOrigin = null;
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        location.hash = "";
        return;
      }
      if (event.key === "Enter" || event.key === "ArrowRight") {
        const current = structureById.get(selectedId || insideId);
        if (current && current.children && current.children.length && event.key === "Enter") {
          location.hash = "inside=" + encodeURIComponent(current.id);
        }
        return;
      }
      if (event.key === "ArrowLeft" && insideId) {
        location.hash = "";
        return;
      }
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        const index = Math.max(0, structureOrder.indexOf(selectedId || structureOrder[0]));
        const next = event.key === "ArrowDown"
          ? structureOrder[Math.min(structureOrder.length - 1, index + 1)]
          : structureOrder[Math.max(0, index - 1)];
        if (insideId) renderCity();
        traceIndex = null;
        traceCard.classList.remove("show");
        selectStructure(next);
      }
    });
    window.addEventListener("pointerdown", (event) => {
      if (!event.target.closest(".structure") && !event.target.closest(".structure-link") && !event.target.closest(".detail")) hideTooltip();
    });

    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    renderNav();
    applyHash();
    window.__isometricReady = true;
  }());
  </script>
</body>
</html>
